<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目工作台</title><link rel="stylesheet" href="styles.css"><script defer src="app.js"></script></head><body>
<div class="shell"><aside><a class="brand" href="./"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M4 6h8v16H4zM16 6h8v9h-8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>项目工作台</a><nav aria-label="工作区"><button data-view="board" aria-pressed="true">待推进</button><button data-view="projects" aria-pressed="false">项目</button><button data-view="activity" aria-pressed="false">进展</button><button data-view="review" aria-pressed="false">复盘</button><button data-view="settings" aria-pressed="false">设置</button></nav><p class="local-note">当前浏览器保存<br>不跨设备同步</p></aside><main>
<p id="hook" class="hook" role="status">先录一个项目和交付日期，今天该推进什么就清楚了。</p>
<header><div><h1 id="page-title">待推进</h1><p id="page-description">按交付日期看清每个项目的下一步。</p></div><button id="add" class="primary">录项目</button></header>
<div id="storage-error" class="warning" role="alert" hidden><p id="storage-message"></p><button id="retry">重试保存</button></div>
<div id="toolbar" class="toolbar"><label id="search-label">搜索项目<input type="search" id="search" placeholder="输入项目名称" autocomplete="off"></label></div>
<section id="board" class="board" aria-label="项目阶段看板"></section>
<section id="projects" hidden><div id="project-list" class="list"></div></section>
<section id="activity" hidden><div id="activity-list" class="list"></div></section>
<section id="review" hidden><div class="panel"><h2>每个阶段有多少项目</h2><p class="muted">从当前项目直接计算，数量和标签一起显示。</p><div id="chart"></div></div></section>
<section id="settings" hidden><form id="settings-form" class="panel"><h2>你的称呼</h2><label>称呼<input id="owner-name" maxlength="40" placeholder="例如：示例用户"></label><button class="primary" type="submit">保存称呼</button><p id="settings-status" role="status"></p><p class="muted">数据保存在当前浏览器。清除站点数据会清除项目，请保留原始工作资料。</p></form></section>
<p id="empty" class="empty" hidden></p></main></div>
<dialog id="create-dialog" aria-labelledby="create-title"><form id="create-form"><h2 id="create-title">录一个项目</h2><label>项目名称<input id="project-name" required maxlength="120" autocomplete="off"></label><label>交付日期<input id="project-due" type="date" required></label><div class="actions"><button type="button" data-close="create-dialog">取消</button><button id="create-save" class="primary" type="submit">保存项目</button></div></form></dialog>
<dialog id="detail-dialog" aria-labelledby="detail-title"><h2 id="detail-title"></h2><p id="detail-date" class="muted"></p><form id="detail-form"><label>阶段<select id="detail-stage"><option value="todo">待开始</option><option value="active">进行中</option><option value="review">待确认</option><option value="done">已完成</option></select></label><label>下一步 / 本次进展<textarea id="detail-note" maxlength="1000" rows="3" placeholder="这次推进了什么，下一步做什么"></textarea></label><div class="actions"><button type="button" data-close="detail-dialog">关闭</button><button id="detail-save" class="primary" type="submit">保存进展</button></div></form><h3>进展历史</h3><ul id="detail-history"></ul></dialog>
</body></html>
