<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>客户跟进示例 · 客户跟进</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body>
<div class="shell">
<aside><a class="brand" href="./">客户跟进示例<span>把每一次联系接起来</span></a><div class="nav-label">工作台</div><nav aria-label="客户视图"><button id="due-view" aria-pressed="true">待跟进 <span id="due-count">0</span></button><button id="all-view" aria-pressed="false">全部客户 <span id="all-count">0</span></button></nav><p class="local-note">本地原型<br>数据仅保存在当前浏览器</p></aside>
<main><header><div><p class="eyebrow">客户关系 / 跟进工作台</p><h1>让下一次联系，有着落。</h1><p id="today" class="subtitle"></p></div><button class="primary" id="add">＋ 添加客户</button></header>
<div id="storage-error" class="warning" role="alert" hidden><span id="storage-message"></span><button id="retry">重试保存</button></div>
<section id="summary" aria-label="跟进概况" hidden><div><span>超期未跟进</span><strong id="overdue">0</strong><small>优先联系这些客户</small></div><div><span>今天待联系</span><strong id="today-count">0</strong><small>给今天留一个明确行动</small></div><div><span>全部客户</span><strong id="total">0</strong><small>每一位都有下一次日期</small></div></section>
<section class="workspace"><div class="toolbar"><div><h2 id="list-heading">待跟进客户</h2><p id="list-description">按下一次联系日期排列</p></div><label class="search"><span class="sr-only">搜索客户姓名</span><input id="search" type="search" placeholder="搜索客户姓名" autocomplete="off"></label></div><div id="empty" class="empty"><span class="empty-mark" aria-hidden="true">↗</span><h3 id="empty-title">从下一次联系开始</h3><p id="empty-text">先添加一位客户，记下下一次联系日期。</p><button id="empty-add" class="primary">添加第一位客户</button></div><ul id="customers" aria-label="客户列表"></ul></section>
<footer>联系不必频繁，下一步需要清楚。<span>客户跟进示例 / 本地工作台</span></footer>
</main></div>
<dialog id="customer-dialog" aria-labelledby="form-title"><form id="customer-form"><div class="dialog-header"><h2 id="form-title">添加客户</h2><button type="button" id="close-dialog" class="close" aria-label="关闭表单">×</button></div><p id="form-description" class="subtitle">先留下一个姓名和下一次联系日期。</p><label id="name-label">客户姓名<input id="customer-name" required maxlength="120" autocomplete="off"></label><label id="record-label" hidden>本次跟进<textarea id="record-text" maxlength="1000" rows="3"></textarea></label><label>下一次联系日期<input id="next-date" type="date" required></label><div class="dialog-actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary" id="save">保存客户</button></div></form></dialog>
</body></html>
