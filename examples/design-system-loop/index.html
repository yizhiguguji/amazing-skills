<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>续读 · 阅读记录演练</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="styles.css"><script defer src="app.js"></script></head>
<body><main><header><p class="context">合成需求演练 · 数据只保存在当前浏览器</p><h1>留一页，给下一次阅读。</h1><p class="lede">记下书名和下一步，回来就能接着读。</p><a href="design-preview.html">查看同一设计系统的组件预览</a></header>
<p id="storage-error" role="alert" hidden>浏览器存储不可用，当前未保存。请检查存储设置后重试；输入已保留。</p>
<div class="workspace"><section aria-labelledby="reading-title"><div class="section-title"><h2 id="reading-title">接着读</h2><span id="record-count" hidden></span></div><div id="empty"><p>还没有阅读记录。</p><p class="muted">从一本正在读的书开始，留下一句下一步。</p><a href="#book-name">添加第一本书</a></div><ul id="books" aria-label="阅读记录"></ul></section>
<section class="entry" aria-labelledby="entry-title"><h2 id="entry-title">留个起点</h2><form id="book-form" novalidate><label for="book-name">书名</label><input id="book-name" name="title" maxlength="200" required aria-describedby="title-error" autocomplete="off"><p id="title-error" class="error"></p><label for="next-step">下次从哪里继续</label><textarea id="next-step" name="next" rows="3" maxlength="500" placeholder="例如：从第二章开始，看看作者如何解释这个问题。"></textarea><p class="muted hint">本地记录，不连接外部书目或账号。</p><button type="submit">保存阅读起点</button><p id="save-status" role="status" aria-live="polite"></p></form></section></div>
<footer>暖色与排版来自带推断标记的设计包；样例不是已确认的真实客户需求。</footer></main></body></html>
